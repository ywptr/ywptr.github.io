<script>
(function(){
const person={owner:{name:'LumaTales · SaaS Owner',brand:'LumaTales',role:'SaaS Master Admin',mode:'saas',view:'operator'},agency:{name:'Northline · Agency Admin',brand:'Northline Creative',role:'Agency Admin',mode:'agency',view:'operator'},creator:{name:'Sandcastle · B2C Creator',brand:'Sandcastle',role:'Creator',mode:'b2c',view:'creator'},end:{name:'LumaTales · End Customer',brand:'LumaTales',role:'End Customer',mode:'end',view:'creator'},super:{name:'Sandcastle · Super Admin',brand:'Sandcastle',role:'Platform Admin',mode:'platform',view:'platform'}};
const st={persona:'owner',view:'operator',page:'Overview',brand:'LumaTales',domain:'create.lumatales.example',accent:'#7354c7',logo:'✦',modes:{webtoon:true,drama:true,ads:false},ai:'byok',models:{image:'MuAPI · Image Pro',video:'MuAPI · Video 2',text:'Language Model A',audio:'MuAPI · Speech'},unit:'episodes',allowance:20,cost:2.4,revision:20,margin:50,fee:4,packageName:'Creator Pro',published:false,creatorMode:'Chat',storyTab:'Narrative',lang:'Auto-detect',preset:'Cinematic',mobileNav:false,modal:'',saved:false,teamInvite:'',dataNotice:'Illustrative numbers only',trial:false};
const opNav=[['Overview','◫'],['My Platform','◈'],['Creative Products','▦'],['AI & Providers','✧'],['Monetization & Billing','＄'],['Customers & Team','♙'],['Business Analytics','▤'],['My Subscription','▣'],['Launch & Growth','↗']];
const creatorNav=[['Home','⌂'],['Story Workspace','✎'],['My Series','▤'],['Characters & World','♧'],['Production','◧'],['Plan & Usage','◴'],['Publish & Share','↗']];
const adminNav=[['Overview','◫'],['Tenants','▦'],['Subscriptions','＄'],['Managed AI','✧'],['Platform Health','◷'],['Audit & Access','⚿']];
const e=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const money=n=>'$'+Number(n).toLocaleString('en-US',{maximumFractionDigits:2,minimumFractionDigits:Number(n)%1?2:0});
const pill=(s,type='')=>`<span class="pill ${type}">${s}</span>`;
const btn=(label,act,cls='')=>`<button class="btn ${cls}" data-act="${act}">${label}</button>`;
const head=(title,subtitle,actions='')=>`<div class="pagehead"><div><div class="eyebrow">${st.view==='platform'?'PLATFORM ADMINISTRATION':st.view==='operator'?'BUSINESS OPERATOR CONSOLE':'CREATOR STUDIO'} / ${e(person[st.persona].brand)}</div><h1 class="h1">${title}</h1><div class="desc">${subtitle}</div></div><div class="actions">${actions}</div></div>`;
const section=(name,sub='',right='')=>`<div class="sectionhead"><div><h2>${name}</h2>${sub?`<p>${sub}</p>`:''}</div>${right}</div>`;
const stat=(label,num,foot)=>`<div class="card"><div class="statlabel">${label}</div><div class="stat">${num}</div><div class="statfoot">${foot}</div></div>`;
const bar=(width,color='')=>`<div class="bar"><i class="${color}" style="width:${width}%"></i></div>`;
const option=(name,val,current,act)=>`<button data-act="${act}" data-value="${e(val)}" class="choice ${current===val?'active':''}">${name}</button>`;
const toggle=(name,description,key)=>`<div class="toggle-row"><div><strong>${name}</strong><div class="muted text-sm" style="margin-top:5px">${description}</div></div><button class="switch ${st.modes[key]?'on':''}" data-act="toggle-product" data-value="${key}" aria-label="Toggle ${name}"></button></div>`;
const range=(label,key,min,max,step,suffix='')=>`<div style="margin-bottom:15px"><div class="range-line"><span>${label}</span><strong>${st[key]}${suffix}</strong></div><input class="rangec" type="range" min="${min}" max="${max}" step="${step}" value="${st[key]}" data-range="${key}"></div>`;
const alert=(message)=>`<div class="note">${message}</div>`;

de 3 · “Below the Pier”</p><div class="note">Visual preview · Narrative / Image / Video tabs</div>`:`<div class="rows"><div class="kv"><b>Series</b><span>The Glass Tide</span></div><div class="kv"><b>Genre</b><span>Fantasy · Mystery</span></div><div class="kv"><b>Format</b><span>Webtoon Series</span></div><div class="kv"><b>Creative direction</b><span>${e(st.preset)} · Approved</span></div><div class="kv"><b>Continuity</b><span>Character bible and canonical timeline enabled</span></div></div>`}</div><div class="card" style="margin-top:14px"><div class="hrow"><strong>Series navigation</strong>${pill('3 / 12')}</div><div class="rows" style="margin-top:14px"><div class="ep-card">✓ Episode 1 · The Arrival</div><div class="ep-card">✓ Episode 2 · The Journal</div><div class="ep-card" style="border-color:var(--accent)">✎ Episode 3 · Below the Pier</div></div></div></div>`}</div>`}

function content(){if(st.view==='creator'){return {'Home':creatorHome,'Story Workspace':storyWorkspace,'My Series':series,'Characters & World':characters,'Production':production,'Plan & Usage':planUsage,'Publish & Share':publish}[st.page]?.()||creatorHome()}if(st.view==='platform'){return {'Overview':adminOverview,'Tenants':tenants,'Subscriptions':subscriptions,'Managed AI':managedAdmin,'Platform Health':health,'Audit & Access':audit}[st.page]?.()||adminOverview()}return {'Overview':overview,'My Platform':platformConfig,'Creative Products':products,'AI & Providers':providers,'Monetization & Billing':monetization,'Customers & Team':customerTeam,'Business Analytics':analytics,'My Subscription':mySubscription,'Launch & Growth':growth}[st.page]?.()||overview()}
function modal(){let map={style:['Creative Direction Library','Eight style presets · narrative, image and video previews · approvals · recommendation provenance.'],invite:['Invite Team Member','Invitation would be handled through IS/Nexus. This prototype does not create a user or change membership.'],topup:['Managed AI Prepaid Top-up','In a production system: choose amount, pay via supported operator account, reconcile payment webhook, then credit the tenant-managed AI ledger.'],pricing:['Customer Pricing Preview','This is where the published plan would appear inside the branded app or hosted pricing widget. Checkout belongs to the operator’s payment provider.'],byok:['Provider Connection','Create your own provider account, select MuAPI, securely submit credentials to the server-side vault, validate permission, then choose supported models.'],service:['Sociosight Services','Optional website launch, blog automation, and social publishing can be quoted and activated separately.'],new:['New Story Wizard','Start with story concept, then series plan, creative direction, episodes and production. This is a navigational mockup.']};let x=map[st.modal]||['Preview / Example','This is a clickable design affordance. It does not create records, charge cards, or perform external actions.'];return `<div class="modal-bg"><div class="modal"><div class="hrow"><h2 style="font:800 19px Manrope;margin:0">${x[0]}</h2><button class="btn sm" data-act="close-modal">✕</button></div><p class="desc" style="margin:18px 0">${x[1]}</p>${st.modal==='style'?`<div class="option-row">${['Cinematic','Warm Illustrated','Graphic Noir','Soft Watercolor','Vibrant Anime','Documentary','Minimal','Retro'].map(x=>`<button data-act="preset" data-value="${x}" class="choice ${st.preset===x?'active':''}">${x}</button>`).join('')}</div><div style="margin-top:13px" class="option-row">${option('Narrative','Narrative',st.storyTab,'story-tab')}${option('Image','Image',st.storyTab,'story-tab')}${option('Video','Video',st.storyTab,'story-tab')}</div><div class="note" style="margin-top:14px">Selected: ${e(st.preset)} · ${e(st.storyTab)} preview. Changes are not committed until approved.</div>`:''}<div style="display:flex;justify-content:flex-end;margin-top:24px">${btn('Close preview','close-modal','primary')}</div></div></div>`}
function draw(){document.getElementById('app').innerHTML=layout()}
function toast(msg){let z=document.getElementById('toast-zone');z.innerHTML=`<div class="toast">${e(msg)}</div>`;setTimeout(()=>{if(z)z.innerHTML=''},3100)}
function go(page){st.page=page;st.mobileNav=false;draw();window.scrollTo(0,0)}
function switchView(view){st.view=view;st.page=view==='creator'?'Home':view==='operator'?'Overview':'Overview';st.mobileNav=false;draw();window.scrollTo(0,0)}
document.addEventListener('change',event=>{let t=event.target;if(t.dataset.range){st[t.dataset.range]=Number(t.value);setTimeout(draw,0);return}if(t.id==='persona-select'){st.persona=t.value;let p=person[st.persona];st.view=p.view;if(t.value==='owner'||t.value==='agency'){st.view='operator'}if(t.value==='owner'){st.brand='LumaTales';st.domain='create.lumatales.example';st.accent='#7354c7'}else if(t.value==='agency'){st.brand='Northline Creative';st.domain='studio.northline.example';st.accent='#4974b7'}st.page=st.view==='creator'?'Home':'Overview';draw()}else if(t.id==='workspace-select'){switchView(t.value)}else if(t.id==='brand-input'){st.brand=t.value||'My Studio';setTimeout(draw,0);toast('Preview brand updated (not saved to a server).')}else if(t.id==='domain-input'){st.domain=t.value||'create.yourbrand.example';setTimeout(draw,0)}else if(t.id==='planname-input'){st.packageName=t.value||'Creator Pro';setTimeout(draw,0)}else if(t.dataset.model){st.models[t.dataset.model]=t.value;toast('Sample model selection updated.')}});
document.addEventListener('input',event=>{let t=event.target;if(t.dataset.range){st[t.dataset.range]=Number(t.value);const strong=t.parentElement.querySelector('.range-line strong');if(strong)strong.textContent=t.value+(t.parentElement.textContent.includes('allowance')||t.parentElement.textContent.includes('margin')||t.parentElement.textContent.includes('assumption')?'%':'')}});
document.addEventListener('click',event=>{const el=event.target.closest('[data-act]');if(!el)return;let a=el.dataset.act,v=el.dataset.value;if(a==='navigate')go(v);else if(a==='mobile-nav'){st.mobileNav=!st.mobileNav;draw()}else if(a==='switch-creator')switchView('creator');else if(a==='switch-operator')switchView('operator');else if(a==='toggle-product'){st.modes[v]=!st.modes[v];draw();toast('Creative product configuration changed (preview only).')}else if(a==='color'){st.accent=v;draw()}else if(a==='save-brand')toast('Brand settings saved in this temporary prototype only.');else if(a==='ai-mode'){st.ai=v;draw()}else if(a==='unit'){st.unit=v;draw()}else if(a==='publish'){st.published=!st.published;draw();toast(st.published?'Pricing demo marked published (no live customer access).':'Demo pricing unpublished.')}else if(a==='creator-mode'){st.creatorMode=v;draw()}else if(a==='story-tab'){st.storyTab=v;draw()}else if(a==='preset'){st.preset=v;draw()}else if(a==='close-modal'){st.modal='';draw()}else if(a==='pricing-preview'){st.modal='pricing';draw()}else if(a==='byok-help'){st.modal='byok';draw()}else if(a==='topup'){st.modal='topup';draw()}else if(a==='invite'){st.modal='invite';draw()}else if(a==='style'){st.modal='style';draw()}else if(a==='new-story'){st.modal='new';draw()}else if(a==='to-monetization')go('Monetization & Billing');else if(a==='plan-details'||a==='add-episodes')go('Plan & Usage');else if(a==='series')go('My Series');else if(a==='story')go('Story Workspace');else if(a==='production')go('Production');else if(a==='tenants')go('Tenants');else if(a==='reset-plan'){st.allowance=20;st.cost=2.4;st.revision=20;st.margin=50;st.fee=4;st.unit='episodes';st.published=false;draw()}else if(a==='send-chat'||a==='chat-choice'){toast('Conversation is a visual mockup; no provider request was made.')}else{st.modal='example';draw()}});
draw();
