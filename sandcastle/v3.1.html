.v31-toolrow{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 15px}
.v31-tool{border:1px solid #e2d4f0;background:#f9f6fd;border-radius:8px;padding:7px 9px;color:#613d8e;font-size:11px}
.v31-select{width:100%;padding:9px 10px;border:1px solid #e1d4ed;border-radius:9px;background:white;color:#423255;font-size:12px}
.v31-textarea{width:100%;min-height:106px;border:1px solid #dfd1eb;border-radius:10px;padding:12px;resize:vertical;color:#37284c;background:#fff}
.v31-label{font-size:11px;color:#79668c;font-weight:750;display:block;margin:10px 0 5px}
.v31-kpi{display:inline-flex;border-radius:20px;background:#f3ecfb;padding:5px 10px;font-size:10px;font-weight:750;color:#6c3bac}
.v31-dash{border:1px dashed #cfb8e5;border-radius:10px;padding:11px;background:#fcfaff}
.v31-result{background:#f7f0fe;border-left:3px solid #8d55cf;border-radius:9px;padding:12px;margin-top:12px;font-size:12px}
.v31-steps{display:flex;gap:5px;flex-wrap:wrap;margin-top:13px}
.v31-step{border:1px solid #d9cbe7;background:#fff;border-radius:30px;padding:6px 8px;font-size:10px;color:#644a7d}
.v31-step.on{background:#6f2ec2;color:#fff;border-color:#6f2ec2}
.v31-list{display:grid;gap:7px;margin:11px 0}
.v31-listitem{display:flex;gap:8px;align-items:start;font-size:12px;color:#574b65}
.v31-dot{width:7px;height:7px;border-radius:50%;background:#b185e4;flex:none;margin-top:6px}
.v31-muted{font-size:11px;color:#8a7899}
.v31-split{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.v31-guide{border-top:1px solid #ebdff4;padding-top:12px;margin-top:12px}
.v31-controls{display:grid;grid-template-columns:1.2fr 1fr .8fr;gap:10px;margin-top:14px}
@media(max-width:1250px){.v31-grid{grid-template-columns:190px minmax(0,1fr)}.v31-right{grid-column:2}}
@media(max-width:760px){.v31-grid,.v31-controls,.v31-split{grid-template-columns:1fr}.v31-right{grid-column:auto}}

/* V3.1 template library + hands-on artifact workspace */
.v31-template-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px}
.v31-template-tabs button{border:1px solid #e4d6ef;border-radius:18px;padding:7px 12px;background:#fff;color:#6e488e;font-size:12px;cursor:pointer}
.v31-template-tabs button.active{background:#eee2fa;border-color:#9a6ccc;color:#6233a0;font-weight:800}
.v31-preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:11px}
.v31-preset{padding:12px;border:1px solid #e8dced;border-radius:12px;background:#fff;display:flex;flex-direction:column;gap:7px;min-height:118px}
.v31-preset.selected{border-color:#9255c9;background:#f9f3ff}
.v31-preset button{align-self:flex-start;border:1px solid #d8c2ec;color:#6934aa;border-radius:7px;background:#fff;padding:5px 9px;font-size:11px;cursor:pointer}
.v31-artifact-grid{display:grid;grid-template-columns:minmax(220px,1.2fr) minmax(280px,1fr);gap:15px}
.v31-artifact-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px}
.v31-artifact-tile{padding:7px;border:1px solid #e7daed;border-radius:11px;text-align:left;background:white;cursor:pointer}
.v31-artifact-tile.selected{border-color:#8e52ce;box-shadow:0 0 0 1px #8e52ce}
.v31-artifact-tile img{width:100%;height:100px;object-fit:cover;border-radius:7px}
.v31-artifact-editor{border:1px solid #e9dcf1;padding:14px;border-radius:12px;background:#fff}
.v31-artifact-editor img{width:100%;max-height:240px;object-fit:contain;background:#f5f1fa;border-radius:9px}
.v31-artifact-editor textarea{width:100%;min-height:91px;border:1px solid #deccea;border-radius:8px;padding:9px}
.v31-artifact-editor input[type=text]{width:100%;padding:9px;border:1px solid #deccea;border-radius:8px}
.v31-asset-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.v31-asset-actions button,.v31-asset-actions a{background:#fff;border:1px solid #cdb2e6;border-radius:8px;padding:7px 10px;font-size:11px;color:#6332a0;text-decoration:none;cursor:pointer}
@media(max-width:850px){.v31-artifact-grid{grid-template-columns:1fr}}

/* V3.1 right-side Creative Assistant and visual preset cards */
.v31-assistant{border:1px solid #ded0ec;background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 8px 25px #40245c10;display:flex;flex-direction:column;min-width:0}
.v31-assistant-header{padding:12px 14px;background:linear-gradient(120deg,#efe3fc,#fff);border-bottom:1px solid #e7d9f2}
.v31-chat-history{min-height:190px;max-height:340px;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.v31-chat-turn{max-width:94%;border-radius:12px;padding:9px 11px;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.v31-chat-turn.assistant{align-self:flex-start;background:#f3edfa;color:#4d3665}
.v31-chat-turn.user{align-self:flex-end;background:#713ac0;color:#fff}
.v31-chat-role{display:block;font-size:10px;font-weight:800;margin-bottom:4px;opacity:.7}
.v31-chat-controls{padding:11px 12px;border-top:1px solid #e7dbf1}
.v31-chat-controls textarea{border:1px solid #d8c6ea;width:100%;padding:9px;border-radius:10px;resize:vertical;min-height:64px;max-height:150px}
.v31-chat-footer{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.v31-chat-footer button{border:0;background:#762dc2;border-radius:8px;color:white;padding:8px 12px;font-size:12px;font-weight:700}
.v31-chat-footer button:disabled{opacity:.45;cursor:not-allowed}
.v31-chat-route{font-size:11px;border:1px solid #d6bcea;border-radius:8px;background:#fff;color:#5a2c99;padding:7px 9px;margin-top:6px;text-align:left}
.v31-preset-thumb{width:100%;height:94px;object-fit:cover;border-radius:9px;background:#e9def7}
.v31-preset-impacts{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 6px}
.v31-preset-impact{display:inline-flex;font-size:9px;line-height:1.2;background:#f1ebf7;border:1px solid #e4d8ef;padding:4px 6px;border-radius:6px;color:#604d74}
.v31-preset .v31-preset-impacts + button{margin-top:auto}
@media(max-width:760px){.v31-chat-history{max-height:270px}}

/* V3.1 synchronized Works levels */
.v31-level-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
.v31-level-btn{border:1px solid #d9c8e9;background:#fff;color:#5e407b;font-size:11px;font-weight:700;border-radius:9px;padding:9px 11px;cursor:pointer}
.v31-level-btn.active{border-color:#8244c5;background:#7535bd;color:white}
.v31-level-btn.secondary{border-style:dashed}
.v31-level-head{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:#8a65ac;margin-top:13px}
.v31-empty{text-align:center;border:1px dashed #d5bde9;background:#faf6fe;border-radius:12px;padding:34px 16px}
.v31-empty .v31-big{font-size:30px;margin-bottom:9px}
.v31-phase-cards{display:grid;gap:11px;margin-top:13px}
.v31-phase-card{padding:14px;border:1px solid #e4d7ee;border-radius:12px;background:#fff}
.v31-phase-card h3{margin:0 0 6px}
.v31-phase-card p{font-size:12px;color:#77688a;margin:0}

/* V3.1 project index and production detail navigation */
.v31-project-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px;margin:17px 0}
.v31-project-card{border:1px solid #e1d5ea;background:#fff;border-radius:16px;overflow:hidden}
.v31-project-card img{display:block;width:100%;height:150px;object-fit:cover}
.v31-project-card-body{padding:15px;display:grid;gap:7px}
.v31-project-card h3{margin:0;font-size:17px}
.v31-project-card button{padding:9px 13px;border-radius:9px;border:1px solid #c3a6de;background:#f8f1ff;color:#633293;font-weight:750;text-align:left;cursor:pointer}
.v31-project-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.v31-project-back{border:1px solid #cfb9e1;border-radius:9px;padding:8px 12px;background:white;color:#68369c;cursor:pointer;font-weight:700}

/* V3.1 character-bible composer */
.v31-character-identity{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.v31-character-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:12px;margin:14px 0}
.v31-character-tile{border:1px solid #e4d5ed;border-radius:12px;padding:12px;min-width:0;background:#fff}
.v31-character-tile h3{font-size:13px;margin:0 0 5px}
.v31-character-photo{height:193px;display:grid;place-items:center;background:#f3edfa;border-radius:10px;overflow:hidden;margin:9px 0}
.v31-character-photo img{height:100%;width:100%;object-fit:cover}
.v31-turn-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:9px 0}
.v31-turn-view{height:153px;background:linear-gradient(155deg,#f5f0fa,#e8def2);border:1px solid #e2d6e9;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.v31-turn-silhouette{font-size:39px;filter:grayscale(1);opacity:.35;line-height:1.3}
.v31-turn-view span{font-size:10px;color:#847291}
.v31-field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.v31-character-field{width:100%;border:1px solid #d9cae6;border-radius:8px;padding:9px;color:#483459;background:white}
textarea.v31-character-field{min-height:100px;resize:vertical}
.v31-character-checks{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.v31-character-check{border-radius:16px;padding:5px 9px;font-size:10px;background:#f1e9f8;color:#715091}
.v31-character-check.yes{background:#e5f4eb;color:#2a7458}
@media(max-width:900px){.v31-character-layout{grid-template-columns:1fr}}@media(max-width:560px){.v31-field-grid{grid-template-columns:1fr}.v31-turn-view{height:118px}.v31-turn-silhouette{font-size:27px}}

/* Character/Place library-first cards */
.v31-library-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin:14px 0}
.v31-library-item{border:1px solid #e4d7ef;background:white;border-radius:12px;overflow:hidden;text-align:left;cursor:pointer}
.v31-library-item img{width:100%;height:125px;object-fit:cover}
.v31-library-item .body{padding:12px;display:grid;gap:6px}
.v31-library-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.v31-import-list{border:1px solid #ded1ed;padding:12px;border-radius:12px;background:#fbf8ff}
.v31-import-row{display:flex;gap:12px;justify-content:space-between;align-items:center;border-bottom:1px solid #e5d8ee;padding:9px 0}
.v31-import-row:last-child{border:0}
.v31-place-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:15px}
.v31-place-tile{border:1px solid #e1d5e9;padding:9px;border-radius:11px}
.v31-place-tile img{width:100%;height:130px;object-fit:cover;border-radius:8px}
.v31-place-tile .placeholder{height:130px;background:#f0eaf6;border-radius:8px;display:grid;place-items:center;font-size:12px;color:#826a94}
.v31-place-tile textarea{min-height:95px;width:100%;padding:8px;border-radius:7px;border:1px solid #decfe9}
@media(max-width:850px){.v31-place-grid{grid-template-columns:1fr}}

/* Shared image-to-image source/result comparison */
.v31-compare{border:1px solid #e2d6ee;border-radius:13px;background:#fff;padding:10px;margin:12px 0}
.v31-compare-stage{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;border-radius:10px;background:#ece7f5}
.v31-compare-stage .v31-before,.v31-compare-stage .v31-after{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.v31-compare-stage .v31-after{clip-path:inset(0 0 0 var(--compare-position,50%))}
.v31-compare-stage .v31-divider{position:absolute;top:0;bottom:0;left:var(--compare-position,50%);border-left:2px solid white;filter:drop-shadow(0 0 2px #2c1748);pointer-events:none;z-index:2}
.v31-compare-stage .v31-divider:after{content:'↔';position:absolute;top:50%;left:-17px;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;background:white;color:#5f2a95;display:grid;place-items:center;box-shadow:0 2px 8px #2c174855;font-weight:bold}
.v31-compare-stage .v31-tag{position:absolute;top:9px;z-index:3;background:#211534cc;color:white;border-radius:15px;padding:5px 9px;font-size:10px;font-weight:700}
.v31-compare-stage .v31-tag.before{left:9px}.v31-compare-stage .v31-tag.after{right:9px}
.v31-compare-slider{width:100%;accent-color:#7136c0;margin:12px 0 3px;cursor:ew-resize}
.v31-compare-controls{display:flex;align-items:center;justify-content:space-between;gap:7px;flex-wrap:wrap;margin-bottom:4px}
.v31-compare-controls button{background:#faf6ff;border:1px solid #dbcbeb;border-radius:8px;padding:6px 10px;color:#613d89;font-size:11px}
.v31-compare-empty{padding:18px;text-align:center;border:1px dashed #d8c7e9;border-radius:11px;background:#faf7fd}
@media(max-width:600px){.v31-compare-stage{aspect-ratio:5/4}}

function v31PresetImage(category,label,index){
const n=label.toLowerCase();
const keys=['romance','realm','mystery','panel','campus','hero','panel2','panel3','panel4'];
if(/horror|thriller|mystery|crime|dark|suspense|post.apocalyptic/.test(n))return ASSETS.mystery;
if(/fantasy|isekai|magic|epic|adventure|science fiction|sci.fi/.test(n))return ASSETS.realm;
if(/anime|manga|webtoon|graphic novel|comic|shōnen|shōjo/.test(n))return ASSETS.panel;
if(/romance|korean|emotional|bollywood|family/.test(n))return ASSETS.romance;
if(/lifestyle|modern|slice of life|thai|campus|ugc/.test(n))return ASSETS.campus;
return ASSETS[keys[(index+['genre','tradition','period','world','tone','visual'].indexOf(category)*2)%keys.length]];
}
function v31PresetAffected(category,label){
let keys=V31_PRESET_IMPACT[category]||[];
const n=label.toLowerCase();
if(category==='genre'&&(/science fiction|fantasy|adventure/.test(n)))keys=[...new Set([...keys,'world','vehicles'])];
if(category==='visual'&&/commercial|product|ugc|editorial/.test(n))keys=[...new Set([...keys,'story'])];
return keys;
}

}

function v31RouteIntent(raw){
const q=raw.toLowerCase();
if(/vehicle|motorcycle|car\b|spaceship|fortress|starship|airship|ship\b/.test(q))return 'vehicles';
if(/outfit|costume|character|voice|personality|appearance/.test(q))return 'characters';
if(/location|place|interior|environment|world\b|setting|city\b/.test(q))return 'world';
if(/storyboard|shot|camera|composition|clip|frame|generate video/.test(q))return 'scene';
if(/episode|dialogue|dialog|conversation|script|story flow/.test(q))return 'flow';
if(/visual|style|palette|anime|korean drama|hollywood|genre|preset/.test(q))return 'style';
return 'story';
}

function productsOperator(){return `${head('Creative Products','Only enable the creative capabilities your business wants to offer.',B('Preview Creator Menus','preview-creator','primary'))}<div class="grid g23">${card(`<h3>Available production verticals</h3><p class="small muted">One shared engine, but configure the niches and workflows offered by your brand.</p>${toggle('Webtoon Series','Story bible, characters, panels, episode production','webtoon')}${toggle('Micro Drama Series','Scripts, scenes, clips, audio and episode assembly','drama')}${toggle('Ad Series Studio','Recurring brand characters, campaign concepts and variations','ads')}<div style="margin-top:14px" class="note">Workflow visibility must be enforced server-side using app entitlements, not only UI menu hiding. A module being shown here does not mean it is fully implemented.</div>`)}${card(`<h3>Shared creator experience</h3><div class="grid g3" style="gap:8px">${[['webtoon','Webtoon','image','romance'],['drama','Micro Drama','film','realm'],['ads','Ad Series','wand','campus']].map(x=>`<div class="card no-padding" style="opacity:${S.features[x[0]]?1:.35}"><img src="${ASSETS[x[3]]}" alt="" style="width:100%;height:85px;object-fit:cover"><div style="padding:9px"><strong class="small">${x[1]}</strong><div class="micro muted">${S.features[x[0]]?'Enabled':'Hidden'}</div></div></div>`).join('')}</div><div class="line"></div><div class="row" style="flex-wrap:wrap">${['Story','Character Bible','Series','Episode','Production','Review'].map(x=>`<span class="workflow-step">${x}</span>`).join('')}</div><div class="line"></div><div class="muted small">Operator can choose models and allowed quality presets for each enabled workflow.</div>${B('Configure AI Models','navigate','sm','data-value="AI & Providers"')}`)}</div>`}
function aiProviders(){return `${head('AI & Providers','Select BYOK or Sandcastle Managed AI. The creative engine remains provider-agnostic.',badge('IG orchestration · concept'))}<div class="grid g23">${card(`<h3>AI access method</h3><div class="actions" style="margin-bottom:16px">${chipAct(`${I('key')} Bring Your Own Key`,'byok',S.service,'ai-service')}${chipAct(`${I('wand')} Managed AI`,'managed',S.service,'ai-service')}</div>${S.service==='byok'?`<div class="note green"><strong>BYOK</strong> · Pay MuAPI directly using your own account. Sandcastle runs the workflow, usage tracking and model selection.</div><div style="margin-top:13px">${field('MuAPI API key (demo input disabled)','•••• •••• ••••','not-used','password','Actual keys are encrypted and stored server-side; never type a real key into this prototype.').replace('data-input="not-used"','disabled')}</div>${B('Preview secure connection','connect-provider','sm')}`:`<div class="note"><strong>Managed AI</strong> · Sandcastle provides access via its provider account. Example pass-through provider cost +20% markup, paid from a prepaid balance.</div><div class="metric" style="margin:13px 0"><label>Illustrative prepaid balance</label><strong>${usd(S.managedBalance)}</strong>${progress(Math.min(100,S.managedBalance/500*100))}</div><div class="actions">${B('Preview $100 Top-up','managed-topup','primary sm')}${B('See fee model','managed-fees','sm')}</div>`}<div class="line"></div><h3>Model selection by task</h3><p class="small muted">Example categories and model labels — not a current/live MuAPI catalog.</p>${[['text','Script & text'],['image','Images & panels'],['video','Video clips'],['audio','Voice & audio']].map(([k,l])=>`<div class="field"><label>${l}</label><select data-model="${k}"><option>${esc(S.model[k])}</option><option>Alternative supported model</option><option>Budget model</option><option>Premium model</option></select></div>`).join('')}<div class="note">Only models tested for each workflow should be offered. Changing models can change quality, output rules and cost estimates.</div>`)}${card(`<h3>Safeguards & usage policy</h3>${[['Credential isolation','Secrets remain server-side, scoped per tenant.'],['Cost evidence','Job result, model, retries, actual provider cost.'],['Spending caps','Limits per tenant and per end customer.'],['Model price changes','Alert and re-price plans with operator approval.'],['Failed generations','Credits/retries reconciled and not double-charged.']].map(x=>`<div class="checkline">${I('check','smicon')}<div><strong>${x[0]}</strong><div class="small muted">${x[1]}</div></div></div>`).join('')}<div class="line"></div><div class="note warn">Managed AI: the proposed 20% markup is applied to provider cost, so gross margin before other charges is 16.7%. Actual pricing, resale permissions, taxes and fees must be verified.</div><div style="margin-top:14px">${B('Open AI Cost Calculator','navigate','sm','data-value="Pricing & Plan Builder"')}</div>` )}</div>`}
function aiEpisodeCost(){return (S.scriptRuns*S.textCost+S.images*S.imageCost+S.videoSeconds*S.videoCost+S.audioSeconds*S.audioCost)*(1+S.retry/100)}
function calcPlan(){const base=aiEpisodeCost();let count=0;let estimate=0; if(S.unit==='episodes'){count=S.included;estimate=S.included*base}else if(S.unit==='credits'){count=S.included;estimate=S.included/100*base}else{count=S.included;estimate=(S.included+S.bonus/100)*base}const ai=estimate*(S.service==='managed'?1.2:1);const overhead=ai*S.overhead/100;const denom=Math.max(.05,1-S.margin/100-S.fee/100);const price=ai*(1+S.overhead/100)/denom;return {per:base,ai,overhead,price,fee:price*S.fee/100,contribution:price-ai-overhead-price*S.fee/100}}
function pricingBuilder(){const p=calcPlan();return `${head('Pricing & Plan Builder','Estimate AI usage, convert it to episodes or credits, and design customer packages with realistic margins.',B('Preview Customer Pricing','navigate','sm','data-value="Customer Plans"'))}<div class="grid g23">${card(`<div class="row between"><h3>Step 1 · Select production recipe</h3>${badge('Not live provider pricing','amber')}</div><div class="actions" style="margin:0 0 15px">${chipAct('Webtoon','webtoon',S.product,'product-recipe')}${chipAct('Micro Drama','drama',S.product,'product-recipe')}${chipAct('Ad Series','ads',S.product,'product-recipe')}</div><div class="small muted" style="margin-bottom:10px">Example recipe based on your chosen models. Costs vary by quality, resolution, durations and retries.</div><div class="grid g2">${slider('Script / text runs','scriptRuns',0,10,1)}${slider('Images / panels','images',0,30,1)}${slider('Video seconds','videoSeconds',0,180,5,'s')}${slider('Voice / audio seconds','audioSeconds',0,180,5,'s')}${slider('Image cost per output','imageCost',.01,1,.01,' USD')}${slider('Video cost per second','videoCost',.01,.3,.01,' USD')}${slider('Audio cost per second','audioCost',0,.05,.005,' USD')}${slider('Text cost per run','textCost',0,.2,.01,' USD')}</div>${slider('Retry / revision allowance','retry',0,100,5,'%')}<div class="note">Numbers above are editable assumptions, not live MuAPI pricing. Actual generation must be metered per provider model and workflow evidence.</div><div class="line"></div><h3>Step 2 · Choose your customer plan</h3>${field('Customer-facing plan name',S.planName,'planName')}<div class="actions" style="margin-bottom:15px">${chipAct('Episodes','episodes',S.unit,'billing-unit')}${chipAct('Credits','credits',S.unit,'billing-unit')}${chipAct('Hybrid','hybrid',S.unit,'billing-unit')}</div>${slider(S.unit==='credits'?'Included credits':'Included episodes','included',S.unit==='credits'?100:1,S.unit==='credits'?3000:100,S.unit==='credits'?10 div><div class="note" style="margin-top:13px">* Contribution excludes Sandcastle subscription, setup fee, support, refunds, taxes, acquisition, and fixed business overhead. BYOK costs still belong to the operator.</div><div class="line"></div><h3>Cost model recommendation</h3><div class="checkline">${I('check','smicon')}<div class="small">Estimate operations first, not a universal cost per episode.</div></div><div class="checkline">${I('check','smicon')}<div class="small">Warn about price changes before a plan is published.</div></div><div class="checkline">${I('check','smicon')}<div class="small">Separate plan allowances from actual provider usage.</div></div>` )}</div>`}
function customerPlans(){const p=calcPlan(),price=S.manualPrice!==''?Number(S.manualPrice):p.price;const sample=[['Starter','Free Trial','3 creative outputs','Draft'],[S.planName,usd(price,2)+' /mo',S.included+' '+S.unit,S.published?'Published':'Draft'],['Studio Plus','$99 /mo','Higher limits · illustrative','Draft']];return `${head('Customer Plans','Configure the subscriptions your customers buy from your own branded SaaS.',B(`${I('plus')} New Plan`,'navigate','primary','data-value="Pricing & Plan Builder"'))}<div class="note" style="margin-bottom:15px">These are your end-customer plans, distinct from your $999 monthly Sandcastle infrastructure subscription. Operator controls pricing and the merchant account.</div><div class="grid g3">${sample.map((x,i)=>`<div class="pricebox ${i===1?'featured':''}"><div class="row between"><strong>${esc(x[0])}</strong>${badge(x[3],x[3]==='Published'?'green':'amber')}</div><div class="price" style="margin:11px 0">${x[1]}</div><div class="small muted">${x[2]}</div><div style="margin-top:13px" class="actions">${B('Preview','customer-pricing','sm')}${i===1?B(S.published?'Unpublish':'Publish','publish-plan','primary sm'):''}</div></div>`).join('')}</div>${section('Hosted Pricing & Embeddable Widget',B('Preview Customer View','customer-pricing','sm'))}${card(`<h3>Use the same plan catalog everywhere</h3><p class="small muted">Show your published plans inside the white-label Creator Studio, on a hosted pricing route, or inside your own marketing landing page. Checkout must validate plan IDs server-side.</p>${row('Hosted page',esc(`https://${S.domain}/pricing`))}${row('Payment account','Operator-owned merchant account')}${row('Published plan',badge(S.published?'1 demo plan':'None',''+(S.published?'green':'amber')))}<div class="line"></div><div class="small fw" style="margin-bottom:6px">Embed example</div><div class="code" id="embed-snippet">&lt;script src="https://cdn.sandcastle.example/pricing-widget.js" data-tenant="${esc(S.domain)}"&gt function v31action(act,val,el){
const v=v31init(),sp=V31_SPACES.find(x=>x.id===v.space)||V31_SPACES[0];
if(act==='v31-space'){v.importKind=null;if(!v31ProjectIndexState().active){v31ProjectIndexState().active=v31ProjectIndexState().projects[0].id;}v.space=val;v.panel='space';render();return;}
if(act==='v31-scene-tab'){v.space='scene';v.panel='space';v.sceneTab=val;render();return;}
if(act==='v31-open-scene'){v.space='scene';v.panel='space';v.sceneTab=val||'scenes';render();return;}
if(act==='v31-webtoon-preview'){if(!v.storyboards.length){notify('Create a storyboard first.');return;}v.webtoonImages=[{id:'demo-image',panels:4}];render();return;}
if(act==='v31-split-demo'){if(!(v.webtoonImages||[]).length)return;v.webtoonPanels=[1,2,3,4].map(i=>({id:'panel-'+i}));render();return;}
if(act==='v31-balloon-demo'){if(!(v.webtoonPanels||[]).length)return;v.balloonDraft=true;render();return;}
if(act==='v31-panel'){if(['splitter','balloons'].includes(val)&&v.mode!=='webtoon')return;v.panel=val;render();return;}


if(act==='v31-entity-create'){
const s=v31EntityState(val),v=v31init();s.count++;const id='new-'+val+'-'+s.count;
const common={id,sourceId:null,sourceProject:v31ProjectIndexState().active,assets:[],localVersion:1,cover:'campus'};
s.records.push(val==='characters'?{...common,name:'New Character '+s.count,personality:'',voice:'',outfit:'Default outfit',portrait:false,turnaround:false,notes:''}:{...common,name:'New Place '+s.count,overview:'',interior:'',schematic:''});
s.active=id;v.importKind=null;render();return;
}
if(act==='v31-entity-open'){const [kind,id]=String(val).split(':'),s=v31EntityState(kind);if(s.records.some(x=>x.id===id))s.active=id;v.importKind=null;render();return;}
if(act==='v31-entity-back'){v31EntityState(val).active=null;v.importKind=null;render();return;}
if(act==='v31-entity-import-open'){v.importKind=val;render();return;}
if(act==='v31-entity-import-close'){v.importKind=null;render();return;}
if(act==='v31-entity-import-apply'){
const [kind,id]=String(val).split(':'),source=v31SharedEntityCatalog()[kind].find(x=>x.uid===id),s=v31EntityState(kind);
if(!source||source.owner===v31ProjectIndexState().active||s.records.some(x=>x.sourceId===id))return;
const imported={...source,id:'import-'+source.uid,sourceId:source.uid,sourceProject:source.owner,assets:[...source.assets],localVersion:1,notes:''};
s.records.push(imported);s.active=imported.id;v.importKind=null;render();return;
}
if(act==='v31-entity-save'){const s=v31EntityState(val),x=s.records.find(z=>z.id===s.active);if(x)x.localVersion++;render();return;}
if(act==='v31-place-variant'){const s=v31EntityState('places'),x=s.records.find(z=>z.id===s.active);if(x)x.localVersion++;render();return;}
if(act==='v31-place-library'){navigate('Library');return;}
if(act==='v31-character-new')return v31action('v31-entity-create','characters',el);
if(act==='v31-character-portrait'){const s=v31CharacterState(),ch=s.records.find(x=>x.id===s.active);if(ch){ch.portrait=true;ch.localVersion++;}render();return;}
if(act==='v31-character-turnaround'){const s=v31CharacterState(),ch=s.records.find(x=>x.id===s.active);if(ch){ch.turnaround=true;ch.localVersion++;}render();return;}
if(act==='v31-character-outfit'){const s=v31CharacterState(),ch=s.records.find(x=>x.id===s.active);if(ch){ch.outfit='New outfit concept';ch.turnaround=false;ch.localVersion++;}render();return;}
if(act==='v31-character-propose'||act==='v31-character-refine'){const s=v31CharacterState(),ch=s.records.find(x=>x.id===s.active);if(ch)ch.localVersion++;render();return;}
if(act==='v31-character-reference'){navigate('Library');return;}
if(act==='v31-boards-create'){v.storyboards.push({name:'Storyboard '+(v.storyboards.length+1),desc:'Provisional episode composition and clip planning',version:1});render();return;}
if(act==='v31-boards-refine'){const x=v.storyboards[Number(val)];if(x)x.version++;render();return;}
if(act==='v31-media-plan-preview'){if(!v.storyboards.length)return;notify('Production request preview only. No media was generated and no credits were spent.');return;}
if(act==='v31-ref'){v.refs=!v.refs;render();return;}
if(act==='v31-previous'){v.previous=!v.previous;render();return;}
if(act==='v31-tool'){v.prompts[v.space]=sp.tools[Number(val)]+': '+(v.prompts[v.space]||sp.prompt);render();return;}
if(['v31-propose','v31-refine','v31-sceneonly'].includes(act)){
const p=(v.prompts[v.space]||sp.prompt).trim();v.version++;
v.results[v.space]={title:act==='v31-sceneonly'?'Scene-local element retained':sp.output,version:v.version,body:act==='v31-sceneonly'?'Prototype: item retained in scene only, no reusable canon entity.':(act==='v31-refine'?'Focused revision proposed. ':'Initial proposal created. ')+'Using '+(v.refs?'selected references, ':'no attachment, ')+(v.previous?'previous revision and ':'')+'project context. Request: '+p.slice(0,210)};render();return;
}
}
function v31TemplateLibraryAction(act,val){
const t=v31templateState(),l=v31libraryState();
if(act==='v31-tpl-tab'){t.tab=val;t.search='';render();return;}
if(act==='v31-select-preset'){t.selections[t.tab]=val;render();return;}
if(act==='v31-tpl-works'){navigate('Works');return;}
if(act==='v31-template-project'){
const n=Number(val),tpl=V31_PROJECT_TEMPLATES[n];if(!tpl)return;
const ps=v31ProjectIndexState();ps.created++;const id='template-project-'+ps.created;
const mode=/Ad /i.test(tpl[0])?'ad':/Reels/i.test(tpl[0])?'reels':/Webtoon|Romance|Fantasy/i.test(tpl[0])?'webtoon':'drama';
ps.projects.unshift({id,name:tpl[0]+' '+ps.created,mode,status:'From template',cover:tpl[1],summary:tpl[2]});
ps.active=id;S.v31={space:'story',panel:'space',mode,detail:false,stage:0,refs:false,previous:false,version:1,results:{},prompts:{},storyboards:[],clips:[]};navigate('Works');return;
}
if(act==='v31-asset-select'){l.selected=val;render();return;}
if(act==='v31-asset-upload'){document.getElementById('v31-file')?.click();return;}
if(act==='v31-asset-revise'){
const a=l.items.find(x=>x.id===l.selected);if(!a)return;
const prompt=(l.drafts[a.id]||'').trim();if(!prompt){notify('Enter a revision instruction first.');return;}
a.version++;a.revisionNote=prompt;render();return;
}
if(act==='v31-asset-use'){S.v31=v31init();S.v31.refs=true;navigate('Works');notify('Artifact selected as sample reference in Works.');return;}
if(act==='v31-asset-download'){const a=l.items.find(x=>x.id===l.selected);if(!a)return;const file=new Blob([JSON.stringify({title:a.name,type:a.type,version:a.version,revisionInstruction:a.revisionNote||null,note:'Mockup artifact metadata, not original media'},null,2)],{type:'application/json'});const u=URL.createObjectURL(file);const link=document.createElement('a');link.href=u;link.download='artifact-'+a.id+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(u),1000);return;}
}
function doAction(act,val,el){
if(act==='v31-compare-edge'){const stage=el.closest('.v31-compare')?.querySelector('.v31-compare-stage'),slider=el.closest('.v31-compare')?.querySelector('.v31-compare-slider');if(stage)stage.style.setProperty('--compare-position',val+'%');if(slider)slider.value=val;return;}
if(act==='v31-project-back'){const ps=v31ProjectIndexState();if(ps.active&&S.v31){if(!S.v31ProjectState)S.v31ProjectState={};S.v31ProjectState[ps.active]=S.v31;}ps.active=null;render();return;}
if(act==='v31-project-open'){
const ps=v31ProjectIndexState(),p=ps.projects.find(x=>x.id===val);if(!p)return;
if(!S.v31ProjectState)S.v31ProjectState={};
if(ps.active&&S.v31)S.v31ProjectState[ps.active]=S.v31;
ps.active=p.id;
S.v31=S.v31ProjectState[p.id]||{space:'story',panel:'space',mode:p.mode,detail:false,stage:0,refs:false,previous:false,version:1,results:{},prompts:{},storyboards:[],clips:[]};
render();return;
}
if(act==='v31-project-create'){
const ps=v31ProjectIndexState();ps.created++;const id='new-project-'+ps.created;
if(!S.v31ProjectState)S.v31ProjectState={};
if(ps.active&&S.v31)S.v31ProjectState[ps.active]=S.v31;
ps.projects.unshift({id,name:'Untitled Project '+ps.created,mode:'drama',status:'New',cover:'hero',summary:'Micro Drama · New project'});
ps.active=id;S.v31={space:'story',panel:'space',mode:'drama',detail:false,stage:0,refs:false,previous:false,version:1,results:{},prompts:{},storyboards:[],clips:[]};render();return;
}
